# Scripts de instalacion permitidos.
#
# Es la misma lista que package.json ya declara en `pnpm.onlyBuiltDependencies`;
# pnpm 11 la lee desde aqui. Sin este archivo, `pnpm install` termina con
# ERR_PNPM_IGNORED_BUILDS y cualquier comando de pnpm posterior falla en su
# comprobacion de dependencias, incluido el `pnpm verify` del build de Cloudflare.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
