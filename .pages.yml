# Modelo editorial de Pages CMS (https://pagescms.org).
#
# El arbol sigue al sitio: un nodo por pagina y, dentro, un nodo por seccion.
# Cada nodo lleva el contenido de su seccion y los textos de interfaz que solo
# aparecen ahi; lo que se repite entre paginas vive en "Transversal".
#
# El contenido esta en src/content/copies.json (clave `site`) y en un archivo
# por servicio en src/content/services/. src/content/schema.ts es el contrato
# que valida ambos en cada build. Si cambia el contrato, cambia este archivo.
#
# Reglas de esta configuracion:
#
# - `settings.content.merge: true` es obligatorio. Cada nodo declara solo una
#   parte del archivo; al guardar, Pages CMS mezcla lo editado con lo que ya
#   esta en GitHub, de modo que el resto se conserva intacto. Las claves que
#   ningun nodo declara (navLinks y las columnas estructurales del footer)
#   tambien sobreviven asi.
# - No se declara `media`: no hay carga de imagenes desde el CMS. Las fotos del
#   equipo se resuelven por una relacion fija entre la ruta editorial y el
#   recurso compilado (src/components/Team.astro), asi que `img` es una lista
#   cerrada de las rutas que ese mapa conoce.
# - El nombre del archivo de cada servicio es su slug, y no se edita desde el
#   CMS: renombrarlo cambiaria la URL publicada.
# - Los campos estructurales (destinos de scroll, tokens de maquetacion, orden)
#   van como `readonly`: el editor los ve, no los cambia.
# - Las opciones cerradas van como `select`, nunca como texto libre.
# - Los textos largos siguen siendo listas de parrafos, sin formato enriquecido:
#   el frontend no tiene politica de sanitizado para HTML.
#
# El orden de los campos dentro de una lista es el orden de las claves en el
# archivo: cambiarlo mueve el JSON al siguiente guardado.

settings:
  content:
    merge: true
content:
  - name: inicio
    label: Inicio
    description: La página principal, sección por sección.
    type: group
    items:
      - name: inicio-hero
        label: Hero
        description: 'Lo primero que se ve: titular, palabras animadas y botones.'
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: heroLines
                label: Titular
                description: Se compone en tres partes; la palabra animada va aparte.
                type: object
                required: true
                fields:
                  - name: middle
                    label: Primera línea
                    type: string
                    required: true
                  - name: last
                    label: Segunda línea
                    type: string
                    required: true
                  - name: object
                    label: Complemento
                    description: Cierra la frase animada, por ejemplo "IA.".
                    type: string
                    required: true
              - name: heroVerbs
                label: Palabras animadas
                description: Rotan en el titular. Cada una lleva su color.
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{word}'
                fields:
                  - name: word
                    label: Palabra
                    type: string
                    required: true
                  - name: color
                    label: Color
                    description: 'Hexadecimal completo, por ejemplo #8A8EF9.'
                    type: string
                    required: true
                    pattern:
                      regex: ^#[0-9a-fA-F]{6}$
                      message: 'Usa un hexadecimal de seis dígitos, por ejemplo #8A8EF9.'
              - name: heroSubtitle
                label: Subtítulo
                type: string
                required: true
              - name: ui
                label: false
                type: object
                fields:
                  - name: hero
                    label: Textos de interfaz
                    type: object
                    required: true
                    fields:
                      - name: cta
                        label: Botón principal
                        type: string
                        required: true
                      - name: services
                        label: Botón de servicios
                        type: string
                        required: true
                      - name: scroll
                        label: Indicador de scroll
                        type: string
                        required: true
                      - name: pause
                        label: Pausar palabras animadas
                        type: string
                        required: true
                      - name: resume
                        label: Reanudar palabras animadas
                        type: string
                        required: true
      - name: inicio-manifiesto
        label: Manifiesto
        description: El bloque de texto que abre el cuerpo de la página.
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: statement
                label: false
                type: object
                required: true
                fields:
                  - name: headline
                    label: Titular
                    type: string
                    required: true
                  - name: body
                    label: Párrafos
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
      - name: inicio-que-hacemos
        label: Qué hacemos
        description: Texto de la sección y las tarjetas de capacidades.
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: whatWeDo
                    label: Título de la sección
                    type: string
                    required: true
              - name: whatWeDo
                label: false
                type: object
                required: true
                fields:
                  - name: body
                    label: Párrafos
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
              - name: capabilities
                label: Tarjetas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
                  - name: span
                    label: Tamaño en la retícula
                    description: Maquetación. Se consulta, no se edita.
                    type: string
                    required: true
                    readonly: true
                  - name: tone
                    label: Tono visual
                    type: select
                    options:
                      values:
                        - label: Neutro
                          value: ''
                        - label: Periwinkle
                          value: peri
                        - label: Oscuro
                          value: dark
                        - label: Turquesa
                          value: teal
                        - label: Dorado
                          value: gold
      - name: inicio-impacto
        label: Nuestro impacto
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: impact
                    label: Título de la sección
                    type: string
                    required: true
              - name: impact
                label: false
                type: object
                required: true
                fields:
                  - name: body
                    label: Párrafos
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
      - name: inicio-servicios
        label: Servicios
        description: 'Solo el título de la sección: cada tarjeta se edita en su servicio, en "Tarjeta en Inicio".'
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: services
                    label: Título de la sección
                    type: string
                    required: true
      - name: inicio-origen
        label: Cómo nació Squai
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: origin
                    label: Título de la sección
                    type: string
                    required: true
              - name: originStory
                label: Párrafos
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
      - name: inicio-equipo
        label: Equipo
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: team
                    label: Título de la sección
                    type: string
                    required: true
              - name: ui
                label: false
                type: object
                fields:
                  - name: team
                    label: Textos de interfaz
                    type: object
                    required: true
                    fields:
                      - name: intro
                        label: Párrafos de introducción
                        type: text
                        required: true
                        list:
                          min: 1
                          collapsible: true
                      - name: memberAlt
                        label: Texto alternativo de las fotos
                        description: Tiene que contener {name} y {role}.
                        type: string
                        required: true
                        pattern:
                          regex: ^(?=.*\{name\})(?=.*\{role\}).*$
                          message: El texto tiene que contener {name} y {role}.
              - name: squadGrid
                label: Personas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{name}'
                fields:
                  - name: img
                    label: Foto
                    description: Solo las fotos ya compiladas en el sitio. Subir fotos nuevas es un cambio de código.
                    type: select
                    required: true
                    options:
                      values:
                        - /images/team1.webp
                        - /images/team2.webp
                        - /images/team3.webp
                        - /images/team4.webp
                        - /images/team5.webp
                        - /images/team6.webp
                  - name: name
                    label: Nombre
                    type: string
                    required: true
                  - name: role
                    label: Cargo
                    type: string
                    required: true
                  - name: linkedin
                    label: LinkedIn
                    description: URL https completa. Vacío oculta el enlace.
                    type: string
                    pattern:
                      regex: ^$|^https://
                      message: Usa una URL que empiece por https:// o deja el campo vacío.
                  - name: d
                    label: Descripción
                    type: text
                    required: true
      - name: inicio-faq
        label: Preguntas frecuentes
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
