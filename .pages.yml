                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
          - name: ctaSecondary
            label: Texto del botón en esta sección
            description: Vacío usa el texto del botón principal.
            type: string
      - name: one-desafio
        label: Desafío
        description: El título de la sección se edita en Transversal → Títulos compartidos.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: challenge
            label: false
            type: object
            required: true
            fields:
              - name: cards
                label: Tarjetas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
      - name: one-programa
        label: Programa
