# Modelo editorial de Pages CMS (https://pagescms.org).
#
# El arbol sigue al sitio: un nodo por pagina y, dentro, un nodo por seccion.
# Cada nodo lleva el contenido de su seccion y los textos de interfaz que solo
# aparecen ahi; lo que se repite entre paginas vive en "Transversal".
#
# El contenido esta en src/content/copies.json (clave `site`) y en un archivo
# por servicio en src/content/services/. src/content/schema.ts es el contrato
# que valida ambos en cada build. Si cambia el contrato, cambia este archivo.
#
# Reglas de esta configuracion:
#
# - `settings.content.merge: true` es obligatorio. Cada nodo declara solo una
#   parte del archivo; al guardar, Pages CMS mezcla lo editado con lo que ya
#   esta en GitHub, de modo que el resto se conserva intacto. Las claves que
#   ningun nodo declara (navLinks y las columnas estructurales del footer)
#   tambien sobreviven asi.
# - No se declara `media`: no hay carga de imagenes desde el CMS. Las fotos del
#   equipo se resuelven por una relacion fija entre la ruta editorial y el
#   recurso compilado (src/components/Team.astro), asi que `img` es una lista
#   cerrada de las rutas que ese mapa conoce.
# - El nombre del archivo de cada servicio es su slug, y no se edita desde el
#   CMS: renombrarlo cambiaria la URL publicada.
# - Los campos estructurales (destinos de scroll, tokens de maquetacion, orden)
#   van como `readonly`: el editor los ve, no los cambia.
# - Las opciones cerradas van como `select`, nunca como texto libre.
# - Los textos largos siguen siendo listas de parrafos, sin formato enriquecido:
#   el frontend no tiene politica de sanitizado para HTML.
#
# El orden de los campos dentro de una lista es el orden de las claves en el
# archivo: cambiarlo mueve el JSON al siguiente guardado.

settings:
  content:
    merge: true
content:
  - name: inicio
    label: Inicio
    description: La página principal, sección por sección.
    type: group
    items:
      - name: inicio-hero
        label: Hero
        description: 'Lo primero que se ve: titular, palabras animadas y botones.'
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: heroLines
                label: Titular
                description: Se compone en tres partes; la palabra animada va aparte.
                type: object
                required: true
                fields:
                  - name: middle
                    label: Primera línea
                    type: string
                    required: true
                  - name: last
                    label: Segunda línea
                    type: string
                    required: true
                  - name: object
                    label: Complemento
                    description: Cierra la frase animada, por ejemplo "IA.".
                    type: string
                    required: true
              - name: heroVerbs
                label: Palabras animadas
                description: Rotan en el titular. Cada una lleva su color.
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{word}'
                fields:
                  - name: word
                    label: Palabra
                    type: string
                    required: true
                  - name: color
                    label: Color
                    description: 'Hexadecimal completo, por ejemplo #8A8EF9.'
                    type: string
                    required: true
                    pattern:
                      regex: ^#[0-9a-fA-F]{6}$
                      message: 'Usa un hexadecimal de seis dígitos, por ejemplo #8A8EF9.'
              - name: heroSubtitle
                label: Subtítulo
                type: string
                required: true
              - name: ui
                label: false
                type: object
                fields:
                  - name: hero
                    label: Textos de interfaz
                    type: object
                    required: true
                    fields:
                      - name: cta
                        label: Botón principal
                        type: string
                        required: true
                      - name: services
                        label: Botón de servicios
                        type: string
                        required: true
                      - name: scroll
                        label: Indicador de scroll
                        type: string
                        required: true
                      - name: pause
                        label: Pausar palabras animadas
                        type: string
                        required: true
                      - name: resume
                        label: Reanudar palabras animadas
                        type: string
                        required: true
      - name: inicio-manifiesto
        label: Manifiesto
        description: El bloque de texto que abre el cuerpo de la página.
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: statement
                label: false
                type: object
                required: true
                fields:
                  - name: headline
                    label: Titular
                    type: string
                    required: true
                  - name: body
                    label: Párrafos
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
      - name: inicio-que-hacemos
        label: Qué hacemos
        description: Texto de la sección y las tarjetas de capacidades.
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: whatWeDo
                    label: Título de la sección
                    type: string
                    required: true
              - name: whatWeDo
                label: false
                type: object
                required: true
                fields:
                  - name: body
                    label: Párrafos
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
              - name: capabilities
                label: Tarjetas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
                  - name: span
                    label: Tamaño en la retícula
                    description: Maquetación. Se consulta, no se edita.
                    type: string
                    required: true
                    readonly: true
                  - name: tone
                    label: Tono visual
                    type: select
                    options:
                      values:
                        - label: Neutro
                          value: ''
                        - label: Periwinkle
                          value: peri
                        - label: Oscuro
                          value: dark
                        - label: Turquesa
                          value: teal
                        - label: Dorado
                          value: gold
      - name: inicio-impacto
        label: Nuestro impacto
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: impact
                    label: Título de la sección
                    type: string
                    required: true
              - name: impact
                label: false
                type: object
                required: true
                fields:
                  - name: body
                    label: Párrafos
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
      - name: inicio-servicios
        label: Servicios
        description: 'Solo el título de la sección: cada tarjeta se edita en su servicio, en "Tarjeta en Inicio".'
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: services
                    label: Título de la sección
                    type: string
                    required: true
      - name: inicio-origen
        label: Cómo nació Squai
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: origin
                    label: Título de la sección
                    type: string
                    required: true
              - name: originStory
                label: Párrafos
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
      - name: inicio-equipo
        label: Equipo
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: team
                    label: Título de la sección
                    type: string
                    required: true
              - name: ui
                label: false
                type: object
                fields:
                  - name: team
                    label: Textos de interfaz
                    type: object
                    required: true
                    fields:
                      - name: intro
                        label: Párrafos de introducción
                        type: text
                        required: true
                        list:
                          min: 1
                          collapsible: true
                      - name: memberAlt
                        label: Texto alternativo de las fotos
                        description: Tiene que contener {name} y {role}.
                        type: string
                        required: true
                        pattern:
                          regex: ^(?=.*\{name\})(?=.*\{role\}).*$
                          message: El texto tiene que contener {name} y {role}.
              - name: squadGrid
                label: Personas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{name}'
                fields:
                  - name: img
                    label: Foto
                    description: Solo las fotos ya compiladas en el sitio. Subir fotos nuevas es un cambio de código.
                    type: select
                    required: true
                    options:
                      values:
                        - /images/team1.webp
                        - /images/team2.webp
                        - /images/team3.webp
                        - /images/team4.webp
                        - /images/team5.webp
                        - /images/team6.webp
                  - name: name
                    label: Nombre
                    type: string
                    required: true
                  - name: role
                    label: Cargo
                    type: string
                    required: true
                  - name: linkedin
                    label: LinkedIn
                    description: URL https completa. Vacío oculta el enlace.
                    type: string
                    pattern:
                      regex: ^$|^https://
                      message: Usa una URL que empiece por https:// o deja el campo vacío.
                  - name: founder
                    label: Es fundador
                    description: Marca a quienes el sitio declara como fundadores (JSON-LD y sección de equipo de Squai One).
                    type: boolean
                  - name: d
                    label: Descripción
                    type: text
                    required: true
      - name: inicio-faq
        label: Preguntas frecuentes
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: labels
                label: false
                type: object
                fields:
                  - name: faq
                    label: Título de la sección
                    type: string
                    required: true
              - name: faqs
                label: Preguntas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{q}'
                fields:
                  - name: q
                    label: Pregunta
                    type: string
                    required: true
                  - name: a
                    label: Respuesta
                    type: text
                    required: true
                    list:
                      min: 1
                      collapsible: true
      - name: inicio-cierre
        label: Cierre
        description: El último bloque antes del footer.
        type: file
        path: src/content/copies.json
        format: json
        fields:
          - name: site
            label: false
            type: object
            fields:
              - name: ui
                label: false
                type: object
                fields:
                  - name: finalCta
                    label: false
                    type: object
                    required: true
                    fields:
                      - name: title
                        label: Título
                        type: string
                        required: true
                      - name: body
                        label: Párrafos
                        type: text
                        required: true
                        list:
                          min: 1
                          collapsible: true
                      - name: cta
                        label: Botón
                        type: string
                        required: true
  - name: servicio-one
    label: Squai One
    description: La página /servicios/squai-one, sección por sección.
    type: group
    items:
      - name: one-hero
        label: Hero
        description: La cabecera de la página del servicio.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: name
            label: Nombre
            type: string
            required: true
          - name: audience
            label: Público
            type: string
            required: true
          - name: slogan
            label: Eslogan
            type: string
            required: true
          - name: cta
            label: Botón principal
            type: object
            required: true
            fields:
              - name: modal
                label: Formulario que abre
                type: select
                options:
                  values:
                    - label: Ninguno (lleva a una sección)
                      value: ''
                    - label: Contacto para empresas
                      value: grow
                    - label: Contacto para instituciones educativas
                      value: learn
              - name: target
                label: Sección destino
                description: Identificador de la sección a la que baja el botón. Se consulta, no se edita.
                type: string
                readonly: true
              - name: label
                label: Texto del botón
                type: string
                required: true
          - name: hero
            label: Encabezado
            type: object
            fields:
              - name: title
                label: Título
                type: string
                required: true
              - name: lead
                label: Subtítulo
                type: text
                required: true
              - name: note
                label: Apunte a mano
                description: Etiqueta oscura junto a la foto.
                type: string
                required: true
              - name: sticker
                label: Segunda etiqueta
                type: string
                required: true
              - name: photoAlt
                label: Descripción de la foto
                description: Texto alternativo para lectores de pantalla.
                type: string
                required: true
              - name: datesPending
                label: Texto mientras no hay fechas
                description: Se muestra hasta que la base de datos entrega las fechas de la cohorte.
                type: string
                required: true
              - name: schedulePending
                label: Texto mientras no hay horario
                description: Se muestra hasta que la base de datos entrega el horario de la cohorte.
                type: string
                required: true
      - name: one-datos-clave
        label: Datos clave
        description: Las fechas y el horario de la cohorte no se editan aquí, salen de la base de datos.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: keyFacts
            label: false
            type: object
            fields:
              - name: title
                label: Título
                type: string
                required: true
              - name: lead
                label: Subtítulo
                type: text
                required: true
              - name: handwritten
                label: Apunte a mano
                type: string
                required: true
              - name: load
                label: Carga del programa
                description: De aquí salen la duración, las sesiones y el dato estructurado que leen los buscadores.
                type: object
                required: true
                fields:
                  - name: weeks
                    label: Semanas
                    type: number
                    required: true
                  - name: sessionsPerWeek
                    label: Sesiones por semana
                    type: number
                    required: true
                  - name: sessionMinutes
                    label: Minutos por sesión
                    type: number
                    required: true
              - name: labels
                label: Títulos de los datos
                type: object
                required: true
                fields:
                  - name: duration
                    label: Duración
                    type: string
                    required: true
                  - name: sessions
                    label: Sesiones
                    type: string
                    required: true
                  - name: dates
                    label: Fechas
                    type: string
                    required: true
                  - name: schedule
                    label: Horario
                    type: string
                    required: true
                  - name: modality
                    label: Modalidad
                    type: string
                    required: true
                  - name: seats
                    label: Cupo
                    type: string
                    required: true
              - name: modality
                label: Texto de modalidad
                type: string
                required: true
              - name: seats
                label: Texto de cupo
                description: No lleva cifras: el cupo real vive en la base de datos.
                type: string
                required: true
              - name: includes
                label: Qué incluye
                description: Son cuatro tarjetas, una por ilustración.
                type: object
                required: true
                list:
                  min: 4
                  max: 4
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
      - name: one-tarjeta
        label: Tarjeta en Inicio
        description: Cómo se ve este servicio en la retícula de la página principal y en el menú.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: menuAudience
            label: Público (menú)
            description: Versión corta para el submenú de Servicios.
            type: string
            required: true
          - name: cardCopy
            label: Texto de la tarjeta
            type: text
            required: true
          - name: discoverLabel
            label: Enlace "descubrir"
            type: string
            required: true
          - name: accent
            label: Color de acento
            type: string
            required: true
            pattern:
              regex: ^#[0-9a-fA-F]{6}$
              message: 'Usa un hexadecimal de seis dígitos, por ejemplo #8A8EF9.'
          - name: span
            label: Tamaño en la retícula
            description: Maquetación. Se consulta, no se edita.
            type: string
            required: true
            readonly: true
          - name: tone
            label: Tono visual
            type: select
            options:
              values:
                - label: Neutro
                  value: ''
                - label: Periwinkle
                  value: peri
                - label: Oscuro
                  value: dark
                - label: Turquesa
                  value: teal
                - label: Dorado
                  value: gold
          - name: order
            label: Posición en la retícula
            description: Orden en el que aparece el servicio. Se consulta, no se edita.
            type: number
            required: true
            readonly: true
      - name: one-payback
        label: Qué te llevas
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: payback
            label: false
            type: object
            required: true
            fields:
              - name: headline
                label: Titular
                type: string
                required: true
              - name: body
                label: Párrafos
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
          - name: ctaSecondary
            label: Texto del botón en esta sección
            description: Vacío usa el texto del botón principal.
            type: string
      - name: one-video
        label: Video de presentación
        description: Con una URL de YouTube se muestra el video, que solo se descarga cuando la persona pulsa reproducir. Vacía, se muestra la ilustración.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: video
            label: false
            type: object
            fields:
              - name: url
                label: URL de YouTube
                description: Acepta enlaces watch?v=, youtu.be/ o embed/. Déjala vacía mientras no haya video.
                type: string
              - name: title
                label: Titular
                type: string
                required: true
              - name: playLabel
                label: Texto del botón de reproducir
                type: string
                required: true
              - name: iframeTitle
                label: Título del video para lectores de pantalla
                type: string
                required: true
              - name: caption
                label: Pie del video
                type: string
                required: true
              - name: posterAlt
                label: Descripción de la ilustración
                type: string
                required: true
      - name: one-desafio
        label: Desafío
        description: El título de la sección se edita en Transversal → Títulos compartidos.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: challenge
            label: false
            type: object
            required: true
            fields:
              - name: cards
                label: Tarjetas
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
      - name: one-programa
        label: Programa
        description: El título de la sección se edita en Transversal → Títulos compartidos.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: capabilities
            label: false
            type: object
            required: true
            fields:
              - name: groups
                label: Bloques
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: tone
                    label: Tono visual
                    type: select
                    options:
                      values:
                        - label: Neutro
                          value: ''
                        - label: Periwinkle
                          value: peri
                        - label: Oscuro
                          value: dark
                        - label: Turquesa
                          value: teal
                        - label: Dorado
                          value: gold
                  - name: items
                    label: Puntos
                    type: string
                    required: true
                    list:
                      min: 1
                      collapsible: false
      - name: one-para-quien
        label: Para quién es
        description: Perfiles, a quién no le sirve y qué necesita quien se inscribe.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: audienceFit
            label: false
            type: object
            fields:
              - name: title
                label: Título
                type: string
                required: true
              - name: handwritten
                label: Apunte a mano
                type: string
                required: true
              - name: profiles
                label: Perfiles
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
              - name: closing
                label: Cierre de los perfiles
                type: text
                required: true
              - name: notFor
                label: No es para ti
                type: object
                required: true
                fields:
                  - name: title
                    label: Título
                    type: string
                    required: true
                  - name: body
                    label: Texto
                    type: text
                    required: true
              - name: needs
                label: Lo que necesitas
                type: object
                required: true
                fields:
                  - name: title
                    label: Título
                    type: string
                    required: true
                  - name: items
                    label: Requisitos
                    type: string
                    required: true
                    list:
                      min: 1
                      collapsible: false
                  - name: note
                    label: Nota
                    type: text
                    required: true
      - name: one-como-funciona
        label: Cómo funciona
        description: Los pasos desde que te inscribes hasta que terminas.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: howItWorks
            label: false
            type: object
            fields:
              - name: title
                label: Título
                type: string
                required: true
              - name: handwritten
                label: Apunte a mano
                type: string
                required: true
              - name: stepLabel
                label: Etiqueta del número de paso
                description: Se muestra como "Paso 1", "Paso 2"...
                type: string
                required: true
              - name: steps
                label: Pasos
                type: object
                required: true
                list:
                  min: 1
                  collapsible:
                    summary: '{t}'
                fields:
                  - name: t
                    label: Título
                    type: string
                    required: true
                  - name: d
                    label: Descripción
                    type: text
                    required: true
                  - name: illustration
                    label: Ilustración
                    type: select
                    required: true
                    options:
                      values:
                        - label: Sobre con llave
                          value: /illustrations/pasos/paso-2.svg
                        - label: Videollamada
                          value: /illustrations/pasos/paso-3.svg
                        - label: Celular con grabación
                          value: /illustrations/pasos/paso-4.svg
                        - label: Certificado
                          value: /illustrations/incluye/incluye-4.svg
                  - name: alt
                    label: Texto alternativo de la ilustración
                    type: string
                    required: true
      - name: one-temario
        label: Temario
