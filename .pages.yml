        description: Solo aparece si el botón principal abre un formulario. Si no, esta página muestra la lista de espera.
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: contactCopy
            label: Titular
            type: text
          - name: contactAside
            label: Nota junto al titular
            type: text
          - name: contactCta
            label: Texto del botón
            description: Vacío usa el texto del botón principal.
            type: string
      - name: one-faq
        label: Preguntas frecuentes
        type: file
        path: src/content/services/squai-one.json
        format: json
        fields:
          - name: faqs
            label: Preguntas
            type: object
            required: true
            list:
              min: 1
              collapsible:
                summary: '{q}'
            fields:
              - name: q
                label: Pregunta
                type: string
                required: true
              - name: a
                label: Respuesta
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
