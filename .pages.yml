# Modelo editorial de Pages CMS (https://pagescms.org).
#
# Todo el contenido del sitio vive en src/content/copies.json bajo la clave
# `site`, y src/content/schema.ts es el contrato que valida ese archivo en cada
# build. Este archivo traduce ese contrato a formularios: mismas areas, mismos
# campos, mismos limites. Si cambia el contrato, cambia tambien este archivo.
#
# Reglas de esta configuracion:
#
# - `settings.content.merge: true` es obligatorio. Cada area declara solo una
#   parte de `site`; al guardar, Pages CMS mezcla lo editado con el archivo que
#   ya esta en GitHub, de modo que las claves no declaradas (navLinks,
#   footerCols) se conservan intactas.
# - No se declara `media`: no hay carga de imagenes desde el CMS. Las fotos del
#   equipo se resuelven por una relacion fija entre la ruta editorial y el
#   recurso compilado (src/components/Team.astro), asi que `img` es una lista
#   cerrada de las rutas que ese mapa conoce.
# - Los campos estructurales (slug, destinos de scroll, tokens de maquetacion)
#   van como `readonly`: el editor los ve, no los cambia.
# - Las opciones cerradas van como `select`, nunca como texto libre.
# - Los textos largos siguen siendo listas de parrafos, sin formato enriquecido:
#   el frontend no tiene politica de sanitizado para HTML.

settings:
  content:
    merge: true

content:
  - name: inicio
    label: Inicio
    description: Hero, manifiesto, programa y etiquetas de sección de la página principal.
    type: file
    path: src/content/copies.json
    format: json
    fields:
      - name: site
        label: false
        type: object
        fields:
          - name: tagline
            label: Frase de marca
            description: Acompaña al logo y abre la página.
            type: string
            required: true
          - name: heroLines
            label: Titular del hero
            description: Se compone en tres partes; la palabra animada va aparte.
            type: object
            required: true
            fields:
              - name: middle
                label: Primera línea
                type: string
                required: true
              - name: last
                label: Segunda línea
                type: string
                required: true
              - name: object
                label: Complemento
                description: Cierra la frase animada, por ejemplo "IA.".
                type: string
                required: true
          - name: heroVerbs
            label: Palabras animadas
            description: Rotan en el hero. Cada una lleva su color.
            type: object
            required: true
            list:
              min: 1
              collapsible:
                summary: '{word}'
            fields:
              - name: word
                label: Palabra
                type: string
                required: true
              - name: color
                label: Color
                description: "Hexadecimal completo, por ejemplo #8A8EF9."
                type: string
                required: true
                pattern:
                  regex: '^#[0-9a-fA-F]{6}$'
                  message: "Usa un hexadecimal de seis dígitos, por ejemplo #8A8EF9."
          - name: heroSubtitle
            label: Subtítulo del hero
            type: string
            required: true
          - name: program
            label: Programa
            description: Ficha del programa que se muestra bajo el hero.
            type: object
            required: true
            fields:
              - name: status
                label: Estado
                type: string
                required: true
              - name: name
                label: Nombre del programa
                type: string
                required: true
              - name: ecosystem
                label: Ecosistema
                type: string
                required: true
              - name: duration
                label: Duración
                type: string
                required: true
              - name: schedule
                label: Modalidad
                type: string
                required: true
              - name: modality
                label: Resultado
                type: string
                required: true
          - name: statement
            label: Manifiesto
            type: object
            required: true
            fields:
              - name: headline
                label: Titular
                type: string
                required: true
              - name: body
                label: Párrafos
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
          - name: whatWeDo
            label: Qué hacemos
            description: El título de la sección se edita en "Etiquetas de sección".
            type: object
            required: true
            fields:
              - name: body
                label: Párrafos
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
          - name: capabilities
            label: Tarjetas de capacidades
            type: object
            required: true
            list:
              min: 1
              collapsible:
                summary: '{t}'
            fields:
              - name: t
                label: Título
                type: string
                required: true
              - name: d
                label: Descripción
                type: text
                required: true
              - name: tone
                label: Tono visual
                type: select
                options:
                  values:
                    - label: Neutro
                      value: ''
                    - label: Periwinkle
                      value: peri
                    - label: Oscuro
                      value: dark
                    - label: Turquesa
                      value: teal
                    - label: Dorado
                      value: gold
              - name: span
                label: Tamaño en la retícula
                description: Maquetación. Se consulta, no se edita.
                type: string
                readonly: true
                required: true
          - name: impact
            label: Nuestro impacto
            type: object
            required: true
            fields:
              - name: body
                label: Párrafos
                type: text
                required: true
                list:
                  min: 1
                  collapsible: true
          - name: labels
            label: Etiquetas de sección y botones
            description: Textos reutilizados en títulos de sección, menú y botones.
            type: object
            required: true
            fields:
              - name: brand
                label: Marca (columna del footer)
                type: string
                required: true
              - name: whatWeDo
                label: Título "Qué hacemos"
                type: string
                required: true
              - name: services
                label: Título "Servicios"
                type: string
                required: true
              - name: impact
                label: Título "Nuestro impacto"
                type: string
                required: true
              - name: origin
                label: Título "Cómo nació"
                type: string
                required: true
              - name: team
                label: Título "Equipo"
                type: string
                required: true
              - name: faq
                label: Título "Preguntas frecuentes"
                type: string
                required: true
              - name: challenge
                label: Título "Desafío" (páginas de servicio)
                type: string
                required: true
              - name: capabilities
                label: Título "Programa" (páginas de servicio)
                type: string
                required: true
              - name: reserve
                label: Botón de reserva
                type: string
                required: true
              - name: call
                label: Botón de llamada
                type: string
                required: true
              - name: terms
                label: Enlace a Términos de Servicio
                type: string
                required: true
              - name: privacy
                label: Enlace a Política de Privacidad
                type: string
                required: true

