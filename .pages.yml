                fields:
                  - name: seo
                    label: false
                    type: object
                    required: true
                    fields:
                      - name: imageAlt
                        label: Texto alternativo de la imagen social
                        type: string
                        required: true
                      - name: serviceTitle
                        label: Plantilla de título para servicios
                        description: Tiene que contener {service}; ahí se inserta el nombre del servicio.
                        type: string
                        required: true
                        pattern:
                          regex: \{service\}
                          message: La plantilla tiene que contener {service}.
          - name: seo-inicio
            label: Inicio
            type: file
            path: src/content/copies.json
            format: json
            fields:
              - name: site
                label: false
                type: object
                fields:
                  - name: seo
                    label: false
                    type: object
                    required: true
                    fields:
                      - name: title
                        label: Título
                        type: string
                        required: true
                      - name: description
                        label: Descripción
                        type: text
                        required: true
          - name: seo-one
            label: Squai One
            type: file
            path: src/content/services/squai-one.json
            format: json
            fields:
              - name: seoTitle
                label: Título
                description: Vacío usa la plantilla general.
                type: string
              - name: seoDescription
                label: Descripción
                type: text
          - name: seo-grow
            label: Squai Grow
            type: file
            path: src/content/services/squai-grow.json
            format: json
            fields:
              - name: seoTitle
                label: Título
                description: Vacío usa la plantilla general.
                type: string
              - name: seoDescription
                label: Descripción
                type: text
          - name: seo-learn
            label: Squai Learn
            type: file
            path: src/content/services/squai-learn.json
            format: json
            fields:
              - name: seoTitle
                label: Título
                description: Vacío usa la plantilla general.
                type: string
              - name: seoDescription
                label: Descripción
                type: text
          - name: seo-terminos
            label: Términos de Servicio
            type: file
            path: src/content/copies.json
            format: json
            fields:
              - name: site
                label: false
                type: object
                fields:
                  - name: legal
                    label: false
                    type: object
                    required: true
                    fields:
                      - name: terms
                        label: false
                        type: object
                        required: true
                        fields:
                          - name: title
                            label: Título
                            type: string
                            required: true
                          - name: description
                            label: Descripción
                            type: text
                            required: true
          - name: seo-politica
            label: Política de Privacidad
            type: file
            path: src/content/copies.json
            format: json
