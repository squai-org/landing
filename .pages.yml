    label: Política de Privacidad
    description: El texto legal completo.
    type: file
    path: src/content/copies.json
    format: json
    fields:
      - name: site
        label: false
        type: object
        fields:
          - name: labels
            label: false
            type: object
            fields:
              - name: privacy
                label: Título visible
                description: Encabeza la página y nombra el enlace en el footer.
                type: string
                required: true
          - name: legal
            label: false
            type: object
            required: true
            fields:
              - name: privacy
                label: false
                type: object
                required: true
                fields:
                  - name: updated
                    label: Fecha de actualización
                    description: Texto visible, por ejemplo "14 de septiembre de 2026".
                    type: string
                    required: true
                  - name: sections
                    label: Secciones
                    type: object
                    required: true
                    list:
                      min: 1
                      collapsible:
                        summary: '{title}'
                    fields:
                      - name: title
                        label: Título de la sección
                        type: string
                        required: true
                      - name: blocks
                        label: Bloques
                        type: block
                        required: true
                        list:
                          min: 1
                          collapsible: true
                        blockKey: type
                        blocks:
                          - name: paragraph
                            label: Párrafo
                            fields:
                              - name: content
                                label: Texto
                                description: Un tramo por cada enlace. Sin enlaces, basta un tramo.
                                type: object
                                required: true
                                list:
                                  min: 1
                                  collapsible: false
                                fields:
                                  - name: text
                                    label: Texto
                                    type: text
                                    required: true
                                  - name: href
                                    label: Enlace
                                    description: Vacío deja el tramo como texto plano.
                                    type: string
                                    pattern:
                                      regex: ^$|^(?:/(?!/)|https://|mailto:|#)
                                      message: 'Usa una ruta interna (/algo), https://, mailto: o #ancla.'
                          - name: list
                            label: Lista
                            fields:
                              - name: items
                                label: Puntos
                                type: text
                                required: true
                                list:
                                  min: 1
                                  collapsible: false
