          - name: site
            label: false
            type: object
            fields:
              - name: ui
                label: false
                type: object
                fields:
                  - name: finalCta
                    label: false
                    type: object
                    required: true
                    fields:
                      - name: title
                        label: Título
                        type: string
                        required: true
                      - name: body
                        label: Párrafos
                        type: text
                        required: true
                        list:
                          min: 1
                          collapsible: true
                      - name: cta
                        label: Botón
                        type: string
                        required: true
